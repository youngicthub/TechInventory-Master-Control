services:
  master:
    build:
      context: ../..                       # repo root
      dockerfile: MasterControl/deploy/Dockerfile
    env_file: ../.env                      # MasterControl/.env on the server
    environment:
      PORT: "4100"
      MASTER_HOST: 0.0.0.0
      MASTER_TRUST_PROXY: "true"           # real visitor IPs come from Caddy
    volumes:
      - releases:/app/MasterControl/releases-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # No "ports:" on purpose - only Caddy is reachable from the internet.

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in deploy/.env, e.g. DOMAIN=master.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - master
    restart: unless-stopped

volumes:
  releases:
  caddy_data:
  caddy_config:
